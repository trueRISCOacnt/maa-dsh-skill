# ============================================================
# MAA 默认选项（用户偏好模板）
# 位置：本技能 templates/default-options.toml
# 用途：作为 maa-cli 自定义任务的基础模板。使用时复制到
#       $MAA_CONFIG_DIR/tasks/<任务名>.toml，再按需补充运行期
#       参数（如 Fight 的 stage、Roguelike 的 theme/squad/roles/
#       core_char/difficulty 等）；或直接照抄其中的 params 块。
# 对应文档：references/maa-official/integration.html
# ============================================================

# ---------- 理智作战：默认不使用药剂、不使用源石 ----------
[[tasks]]
type = "Fight"
params = { medicine = 0, stone = 0 }

# ---------- 基建换班：队列轮换 ----------
# mode = 20000（Rotation 一键轮换，跳过控制中枢/发电站/宿舍/办公室）
# drones = "_NotUse" 不使用无人机；replenish 源石碎片自动补货；
# 会客室：收取信息板信用、进行线索交流、不赠送线索；
# continue_training 训练室专精完成后不继续尝试专精当前技能。
# facility 可按需增删（Mfg/Trade/Reception/Processing/Training）。
[[tasks]]
type = "Infrast"
params = {
  facility = ["Mfg", "Trade", "Reception"],
  mode = 20000,
  drones = "_NotUse",
  replenish = true,
  reception_message_board = true,
  reception_clue_exchange = true,
  reception_send_clue = false,
  continue_training = false,
}

# ---------- 自动肉鸽：开始探索 2 次后停止任务；满级后自动停止 ----------
[[tasks]]
type = "Roguelike"
params = { starts_count = 2, stop_at_max_level = true }
